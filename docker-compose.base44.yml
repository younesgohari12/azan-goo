name: snappshop-automation

services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Dependencies live in a named volume, installed from the mounted lockfile on boot,
    # then the Vite dev server runs from the bind-mounted source (live reload).
    command: sh -ec "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    labels:
      base44.project: 'SnappShop Automation'
      base44.kind: 'web'
      base44.port: '3000'

volumes:
  node_modules:
