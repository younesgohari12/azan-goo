# محیط توسعهٔ کیف پول Orbit برای پیش‌نمایش Base44
#
# این فایل فقط برای اجرای کیف پول در سندباکس است: کد از همین ریپو (bind mount)
# اجرا می‌شود، وابستگی‌ها هنگام بالا آمدن کانتینر از lockfile نصب می‌شوند و
# dev server با hot reload روی پورت ۳۰۰۰ بالا می‌آید. تصویر پایه یک تصویر
# عمومی node است، نه ایمیج ساخته‌شدهٔ خود پروژه، تا هر ویرایشی فوراً دیده شود.
#
# متغیرهای BASE44_PREVIEW_MODE و __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS به‌صورت
# pass-through (بدون مقدار) از محیط پلتفرم به سرویس می‌رسند:
#   - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: هاست‌های مجاز پیش‌نمایش (Vite >= 6.1)
#   - BASE44_PREVIEW_MODE=1: فعال‌کردن polling برای فایل‌واچر روی bind mount
# بیرون از سندباکس این متغیرها تعریف نشده‌اند و رفتار پیش‌فرض Vite حفظ می‌شود
# (نگاه کنید به vite.config.ts).

services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
        exec npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./:/app
      - orbit_wallet_node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: on-failure

volumes:
  orbit_wallet_node_modules:
