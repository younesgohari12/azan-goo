server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Development preview: never cache, so source edits show on refresh.
    add_header Cache-Control "no-store" always;

    # Keep repository metadata and config out of the served tree.
    location ~ /\. { deny all; }
    location ~* \.(ya?ml|json|md|env)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
