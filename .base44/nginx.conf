# Sandbox-only server config (not part of the plugin).
#
# Serves the standalone YAgent workspace demo from the cloned source and the
# downloadable plugin package. Files are read straight from disk, so source
# edits show up on the next browser reload (no HMR — reload the preview).
server {
    listen 3000;
    server_name _;

    root /app;

    # Preview entry point: the standalone workspace demo (mock data).
    location = / {
        try_files /.base44/dev/index.html =404;
    }

    # Direct download of the complete plugin source.
    location = /yagent-ai.zip {
        alias /app/.base44/download/yagent-ai.zip;
        add_header Content-Disposition 'attachment; filename="yagent-ai.zip"';
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
